<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container{
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-self: center;
        gap: 20px;
      }
      .pricing-plan{
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 260px;
        height: 380px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.2s;
      }
      .pricing-plan:hover{
        transform: translateY(-3px);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      }
      .plan-title{
        display: flex;
        justify-content: center;
        align-items: center;
        width: auto;
        height: 60px;
        font-family: "Poppins", Arial, sans-serif;
        color: white;
      }
      .plan-price{
        display: flex;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        padding-top: 20px;
        font-family: "Poppins", Arial, sans-serif;
      }
      .plan-price .terk-luy{
        font-size: 34px;
        font-weight: 700;
      }
      .plan-features{
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        align-self: flex-start;
        list-style: none;
        line-height: 3;
        font-family: "Open Sans", Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        color: #666666;
      }
      .plan-button{
        border-radius: 20px;
        padding: auto;
        margin: 25px;
        width: 140px;
        height: 40px;
        align-self: center;
        border: none;
        font-family: "Poppins", Arial, sans-serif;
        color: white;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .plan-button:hover{
        cursor: pointer;
          transform: translateY(-3px);
          box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
          opacity: 0.8;
      }
      /* style basic,standard,premium */
      .basic .plan-title,
      .basic .plan-button{
        background: linear-gradient(135deg, #1a8cf0, #5b5be0);
      }
      .basic .plan-price {
         color: #3a74e8;
      }
      .standard .plan-title,
      .standard .plan-button{
        background: linear-gradient(135deg, #6a4ce0, #a23fd6);
      }
      .standard .plan-price {
        color: #8043d8;
      }      
      .premium .plan-title,
      .premium .plan-button{
        background: linear-gradient(135deg, #b23fd6, #f0368f);;
      }
      .premium .plan-price {
        color: #d0359f;
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan basic">
        <div class="plan-title">Basic</div>
        <div class="plan-price"><span class="terk-luy">$9.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan standard">
        <div class="plan-title">Standard</div>
        <div class="plan-price"><span class="terk-luy">$19.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan premium">
        <div class="plan-title">Premium</div>
        <div class="plan-price"><span class="terk-luy">$49.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
